<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tangosara — moved</title>
    <!-- GitHub Pages serves this file for every path that no longer exists
         here — which is all of them except the stub index. Old deep links
         (/bold.html, /diagrams/...) forward to the SAME path on the new host,
         where those files live. The meta refresh is the no-JS fallback and can
         only carry the root. -->
    <meta http-equiv="refresh" content="1; url=https://tangosara.pages.dev/">
    <script>
        location.replace("https://tangosara.pages.dev"
            + location.pathname + location.search + location.hash);
    </script>
    <style>
        body {
            background: #111009; color: #e8e4de;
            font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
        }
        main { text-align: center; padding: 2rem; }
        a { color: #e3b341; }
        p { color: #8a8578; font-size: 0.9rem; }
    </style>
</head>
<body>
    <main>
        <h1>tangosara has moved</h1>
        <p>This site now lives at
           <a href="https://tangosara.pages.dev/">tangosara.pages.dev</a> &mdash;
           taking you there.</p>
    </main>
</body>
</html>
